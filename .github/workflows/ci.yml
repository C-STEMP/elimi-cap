name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CI: "true"
      # The build under test talks to fake hosts; e2e/support/mockApi.ts answers every call.
      NEXT_PUBLIC_CAP_URL: http://cap.e2e.test/v1/cap
      NEXT_PUBLIC_ORCHESTRATOR_URL: http://orchestrator.e2e.test/v1/ol
      NEXT_PUBLIC_GOOGLE_CLIENT_ID: e2e-google-client-id
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      # The codebase has existing lint errors; report them without blocking
      # until they're cleaned up, then remove continue-on-error.
      - name: Lint
        run: npm run lint
        continue-on-error: true

      - name: Build
        run: npm run build

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: End-to-end tests
        run: npm run test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
